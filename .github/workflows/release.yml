name: Release

# Opens and updates the pull request that applies the pending version bumps and
# changelogs. It never publishes — see publish.yml, which is started by hand.
#
# The split exists because publishing is irreversible: npm will not let a
# version number be reused, ever. Something that cannot be taken back should not
# be a side effect of pushing to a branch.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch to work out what
          # changed, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `publish:` input, so the action only ever versions. With no pending
      # changesets it does nothing at all.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'Release: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
