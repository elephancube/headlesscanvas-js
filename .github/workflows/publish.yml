name: Publish

# Started by hand, after the version pull request from release.yml is merged.
#
# Deliberately not automatic. npm never allows a version number to be reused, so
# a mistaken publish cannot be undone — only followed by another version. A
# human decides when that happens, and the npm-publish environment can require a
# second one to approve it.
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  # changesets pushes the release tags it creates.
  contents: write
  # Provenance. Without this npm publishes unsigned, silently.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Holds the npm token, and can require an approval before the job starts.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that NODE_AUTH_TOKEN below is read into.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # CI has already run on this commit, but "probably green" is not good
      # enough for the one step that cannot be taken back.
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      # Published with pnpm rather than `changeset publish`, which reports a
      # failed publish by crashing inside its own error classifier
      # ("Cannot read properties of undefined (reading 'includes')" in
      # isAlreadyPublishedError) and never printing what npm actually said.
      # Versioning is release.yml's job, so nothing here needs changesets.
      #
      # pnpm replaces the `workspace:*` ranges with real versions and skips
      # anything already on the registry, so re-running this is safe.
      #
      # `--provenance` attaches a signed statement of which commit and workflow
      # built the tarball, verifiable from the npm page. It has to be the flag:
      # pnpm does not read npm's `NPM_CONFIG_PROVENANCE` environment variable,
      # which is how 0.1.0 went out without one.
      #
      # No token: npm is configured to trust this workflow, in this repository,
      # running in this environment, and pnpm exchanges the job's OIDC identity
      # for a short-lived credential. Nothing long-lived exists to be stolen.
      - name: Publish
        run: |
          pnpm -r --filter "./packages/*" publish \
            --access public --no-git-checks --provenance

      # changesets/action used to do this as part of publishing. One tag rather
      # than one per package, because `fixed` in the changesets config keeps all
      # three on the same version by construction.
      - name: Tag the release
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"
