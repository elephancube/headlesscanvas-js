name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the most recent commit needs to be published, but a run already
# deploying is allowed to finish rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated in the VitePress config reads commit times.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      # The site is served from /headlesscanvas-js/ on github.io. Setting
      # DOCS_BASE to '/' is all that changes when a custom domain is added.
      - name: Build
        run: pnpm docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
