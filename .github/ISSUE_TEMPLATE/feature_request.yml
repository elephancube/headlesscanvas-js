name: Feature request
description: Suggest something the library should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some things are deliberately out of scope — feature parity with
        Fabric.js, rich-text editing, image filters, and application chrome such
        as toolbars and colour pickers. HeadlessCanvas is an engine, not an
        application. Proposals in those areas are still welcome, but they need
        an argument for why they belong in every editor built on top of this.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: |
        Custom shapes, custom tools and replacing the control UI cover a lot of
        ground. Knowing where they fell short helps.
